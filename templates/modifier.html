
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier un produit - Ma Boutique</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="navbar">
        <div>
            <h1>Ma Boutique</h1>
            <p>Gestion de stock</p>
        </div>

        <nav>
            <a href="{{ url_for('accueil') }}">Produits</a>
            <a href="{{ url_for('historique') }}">Historique des mouvements</a>
        </nav>
    </div>

    <div class="container">
        <div class="card">

            <h2>Modifier un produit</h2>

            <form class="product-form"
                  action="{{ url_for('modifier', id_produit=produit[0]) }}"
                  method="POST">

                <div class="form-group">
                    <label for="nom">Nom du produit</label>
                    <input type="text" id="nom" name="nom"
                           value="{{ produit[1] }}" required>
                </div>

                <div class="form-group">
                    <label for="prix">Prix</label>
                    <input type="number" id="prix" name="prix"
                           value="{{ produit[2] }}"
                           step="0.01" min="0" required>
                </div>

                <div class="form-group">
                    <label for="quantite">Quantité</label>
                    <input type="number" id="quantite" name="quantite"
                           value="{{ produit[3] }}" min="0" required>
                </div>

                <div class="form-group">
                    <label for="categorie_id">Catégorie</label>
                    <select id="categorie_id" name="categorie_id" required>
                        {% for categorie in categories %}
                        <option value="{{ categorie[0] }}"
                            {% if categorie[1] == produit[4] %}selected{% endif %}>
                            {{ categorie[1] }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <button class="btn-ajouter" type="submit">
                    Enregistrer les modifications
                </button>

            </form>

            <p>
                <a class="btn-modifier"
                   href="{{ url_for('accueil') }}">
                    Retour aux produits
                </a>
            </p>

        </div>
    </div>

</body>
</html>
